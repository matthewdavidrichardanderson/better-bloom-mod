name: Build Better Bloom (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Better Bloom
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out Dusklight SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: host-sdk
          persist-credentials: false

      - name: Fetch SDK headers
        run: git -C host-sdk submodule update --init --depth 1 extern/aurora

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Set up build tools
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          cmake==3.31.10 ninja==1.13.0

      - name: Build and validate Windows package
        run: ./.github/scripts/build-windows.ps1 -DusklightDir "${{ github.workspace }}/host-sdk"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-bloom-windows-x64
          path: |
            dist/Better Bloom.dusk
            dist/Better Bloom.dusk.sha256
          if-no-files-found: error
