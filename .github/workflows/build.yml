name: Build Better Bloom (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Better Bloom
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out Dusklight SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: TwilitRealm/dusklight
          ref: 40457c6adb381928e4b5fef6ed459ed291edd5e2
          path: host-sdk
          persist-credentials: false

      - name: Fetch SDK headers
        run: git -C host-sdk submodule update --init --depth 1 extern/aurora

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Set up build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.8 ninja==1.12.1

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSKLIGHT_DIR="${{ github.workspace }}/host-sdk"
          -DBETTER_BLOOM_TESTS=ON
          -DBETTER_BLOOM_GPU_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Stage package
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath build/mods/better_bloom.dusk -Destination 'dist/Better Bloom.dusk'
          $packageHash = (Get-FileHash -LiteralPath 'dist/Better Bloom.dusk' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash *Better Bloom.dusk" | Set-Content -LiteralPath 'dist/Better Bloom.dusk.sha256' -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-bloom-windows-x64
          path: |
            dist/Better Bloom.dusk
            dist/Better Bloom.dusk.sha256
          if-no-files-found: error
